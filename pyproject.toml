[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to read Garmin activities and create/schedule structured workouts and training plans on Garmin Connect."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yash Hooda" }]
keywords = ["mcp", "garmin", "running", "training", "workouts", "claude"]
dependencies = [
    "mcp>=1.2",
    "garminconnect>=0.3.6",
    "garth>=0.4.45",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6,<0.17"]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-auth = "garmin_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/yashhooda1/mcp-garmin"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp", "plans"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's implicit defaults means a ruff release
# can turn CI red without a single line of our code changing.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
